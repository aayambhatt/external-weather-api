spring:
  application:
    name: ExternalApi
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: localhost
      port: 6379

weather:
  api:
    key: ${WEATHER_API_KEY}
    base-url: https://weather.visualcrossing.com/VisualCrossingWebServices/rest/services/timeline
    unit-group: metric
